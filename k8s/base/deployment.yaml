apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakura-ai-engine-searchtool
  labels:
    app.kubernetes.io/name: sakura-ai-engine-searchtool
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sakura-ai-engine-searchtool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sakura-ai-engine-searchtool
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              curl -fsSL -o /workspace/searchtool \
                "https://github.com/mi2428/searchtool/releases/download/${SEARCHTOOL_RELEASE_TAG}/searchtool-linux-amd64" && \
              chmod 755 /workspace/searchtool
          env:
            - name: SEARCHTOOL_RELEASE_TAG
              value: "v0.1.1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: searchtool
          image: gcr.io/distroless/static-debian13:nonroot
          imagePullPolicy: IfNotPresent
          command: ["/workspace/searchtool"]
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: searchtool-credentials
          env:
            - name: SEARCHTOOL_LISTEN_ADDRESS
              value: ":8081"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: workspace
          emptyDir: {}
